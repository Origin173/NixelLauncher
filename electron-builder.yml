appId: io.nixel.launcher
productName: NixelLauncher
directories:
  output: release
  buildResources: resources
asar: true
allowMissingDependencies: false
files:
  - out/**/*
  - package.json
  - "!**/*.map"
extraResources:
  - from: docs/licenses
    to: licenses
  - from: .env.example
    to: .env.example
publish: null
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
win:
  icon: resources/nixel.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: "${productName}-${version}-windows-${arch}-setup.${ext}"
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: false
portable:
  artifactName: "${productName}-${version}-windows-${arch}-portable.${ext}"
mac:
  icon: resources/nixel.png
  category: public.app-category.games
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
linux:
  icon: resources/nixel.png
  category: Game
  synopsis: Minecraft Java Edition launcher
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  maintainer: NixelLauncher contributors
deb:
  # Electron links libasound.so.2; append to electron-builder's default dependencies.
  fpm:
    - --depends
    - libasound2t64 | libasound2
